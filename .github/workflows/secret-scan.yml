# Secret scan: looks for leaked keys and passwords in the new commits of a PR or a push to main.
# Run it by hand (Actions tab, "Run workflow") to scan the whole history of the branch.
# Real values belong in docker/.env (git-ignored), see .claude/rules/security.md.
name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the scan reads the commit history, not just the latest files

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
