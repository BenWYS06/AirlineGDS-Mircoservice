# Backend CI: compiles the Maven modules and runs the tests that are ready, on each PR and on main.
# Stages and what joins next: docs/plans/2026-11-04-ci-pipeline.md.
name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

# A newer push to the same PR cancels the run that is still going
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile and test (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # booking and payment wait for their event producers (refactor build step 6, outbox).
      # That PR removes this -pl filter, so from then on every module is compiled.
      - name: Compile modules
        run: mvn -B -ntp compile -pl '!services/booking-service,!services/payment-service'

      # Only the modules whose tests need no database yet; the others join per the plan (stage 4)
      - name: Run tests
        run: mvn -B -ntp test -pl common-lib,cloud/service-registry,cloud/config-server,cloud/api-gateway,services/user-service,services/notification-service -am
