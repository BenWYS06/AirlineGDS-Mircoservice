spring:
  application:
    name: payment-service

  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/airline_payment_db?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}   # schema is owned by Flyway (db/migration)

  kafka:
    bootstrap-servers: localhost:9092

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        group:
          enabled: true

# VNPay sandbox. Get TmnCode + HashSecret by registering at https://sandbox.vnpayment.vn/devreg/
# and set them as environment variables (see docker/.env.example).
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:CHANGE_ME}
  hash-secret: ${VNPAY_HASH_SECRET:CHANGE_ME}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  # FE page VNPay sends the browser back to; "/{bookingId}" is appended
  return-url: ${VNPAY_RETURN_URL:http://localhost:5173/booking-success}
  # Link lifetime. Shorter than the seat hold (15 min) by the IPN grace (2 min) + one expiry-job run
  expire-minutes: 10

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 3000ms
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - feign.FeignException
        ignore-exceptions:
          - com.ben.common_lib.exception.UserException
          - com.ben.common_lib.exception.AirportException

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    register-with-eureka: true
    fetch-registry: true

info:
  app:
    name: ${spring.application.name}
    description: Handles payment processing via the VNPay gateway
    version: 1.0.0
    environment: development

management:
  endpoints:
    web:
      exposure:
        include: health, info, circuitbreakers, circuitbreakerevents
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  health:
    circuitbreakers:
      enabled: true
