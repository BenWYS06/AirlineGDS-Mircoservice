server:
  port: 5002
  tomcat:
    accesslog:                      # PERF-LAB: one line per request, with its time in ms
      enabled: true
      directory: logs
      pattern: "%t %m %U%q status=%s time=%Dms"

spring:
  application:
    name: flight-ops-service
  config:
    import: optional:configserver:http://localhost:8888
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1
  cache:
    type: redis
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/airline_flight_db?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}   # schema is owned by Flyway (db/migration)
    properties:
      hibernate:
        generate_statistics: true   # PERF-LAB: logs "Session Metrics" (DB time + statement count) per request
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        group:
          enabled: true
      client:
        config:
          default:
            logger-level: full      # PERF-LAB: log every call to another service with its time

# PERF-LAB: remove this block when you are done
logging:
  level:
    org.hibernate.SQL: DEBUG        # every SQL statement
    com.ben.services.client: DEBUG  # Feign calls

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 3000ms
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - feign.FeignException
        ignore-exceptions:
          - com.ben.common_lib.exception.UserException
          - com.ben.common_lib.exception.AirportException
    instances:
      AirlineClient:
        base-config: default
        failure-rate-threshold: 60
        wait-duration-in-open-state: 20s
      LocationClient:
        base-config: default
        wait-duration-in-open-state: 20s
      PricingClient:
        base-config: default
      SeatClient:
        base-config: default

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    register-with-eureka: true
    fetch-registry: true

info:
  app:
    name: ${spring.application.name}
    description: Manages flight schedules, instances, and real-time flight operations
    version: 1.0.0
    environment: development

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, circuitbreakers, circuitbreakerevents
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  health:
    circuitbreakers:
      enabled: true
