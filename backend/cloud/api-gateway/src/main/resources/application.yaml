server:
  port: 5000

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ben-airline}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/ben-airline/protocol/openid-connect/certs}
          audiences: ${KEYCLOAK_AUDIENCE:airline-api}

security:
  internal-api-key: ${INTERNAL_API_KEY:local-development-only-key}
  keycloak:
    client-id: ${KEYCLOAK_CLIENT_ID:airline-api}
  user-cache-ttl: ${USER_ID_CACHE_TTL:PT5M}

services:
  user-service:
    base-url: ${USER_SERVICE_URL:http://user-service}

resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
        cancel-running-future: true
    instances:
      booking-service-cb:
        timeout-duration: 8s
      payment-service-cb:
        timeout-duration: 10s
  circuitbreaker:
    configs:
      gateway-default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
    instances:
      booking-service-cb:
        base-config: gateway-default
        failure-rate-threshold: 40
        wait-duration-in-open-state: 45s
      payment-service-cb:
        base-config: gateway-default
        failure-rate-threshold: 30
        wait-duration-in-open-state: 60s
      flight-ops-service-cb:
        base-config: gateway-default
      seat-service-cb:
        base-config: gateway-default
      pricing-service-cb:
        base-config: gateway-default
      ancillary-service-cb:
        base-config: gateway-default
      location-service-cb:
        base-config: gateway-default
      airline-core-service-cb:
        base-config: gateway-default
      user-service-cb:
        base-config: gateway-default

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
  client:
    register-with-eureka: true
    fetch-registry: true

info:
  app:
    name: ${spring.application.name}
    description: API Gateway - routes and load balances all incoming requests across microservices
    version: 1.0.0
    environment: development

management:
  endpoints:
    web:
      exposure:
        include: health, info, circuitbreakers, circuitbreakerevents
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  health:
    circuitbreakers:
      enabled: true
